steps:
  - id: Install Dependencies
    name: node:18
    entrypoint: npm
    args:
      - ci

  - id: Build Application
    name: node:18
    entrypoint: npm
    args:
      - run
      - build
    env:
      - EMAILJS_SERVICE_ID=${_EMAILJS_SERVICE_ID}
      - EMAILJS_TEMPLATE_ID=${_EMAILJS_TEMPLATE_ID}
      - EMAILJS_PUBLIC_KEY=${_EMAILJS_PUBLIC_KEY}
      - VITE_EMAILJS_SERVICE_ID=${_EMAILJS_SERVICE_ID}
      - VITE_EMAILJS_TEMPLATE_ID=${_EMAILJS_TEMPLATE_ID}
      - VITE_EMAILJS_PUBLIC_KEY=${_EMAILJS_PUBLIC_KEY}

  - id: Deploy to Cloud Run
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        gcloud run deploy "${_SERVICE_NAME}" \
          --source . \
          --region "${_REGION}" \
          --platform managed \
          --allow-unauthenticated \
          --port "${_PORT}" \
          --set-build-env-vars "EMAILJS_SERVICE_ID=${_EMAILJS_SERVICE_ID},EMAILJS_TEMPLATE_ID=${_EMAILJS_TEMPLATE_ID},EMAILJS_PUBLIC_KEY=${_EMAILJS_PUBLIC_KEY},VITE_EMAILJS_SERVICE_ID=${_EMAILJS_SERVICE_ID},VITE_EMAILJS_TEMPLATE_ID=${_EMAILJS_TEMPLATE_ID},VITE_EMAILJS_PUBLIC_KEY=${_EMAILJS_PUBLIC_KEY}" \
          --quiet

substitutions:
  _SERVICE_NAME: portfolio
  _REGION: us-central1
  _PORT: "8080"
  _EMAILJS_SERVICE_ID: ""
  _EMAILJS_TEMPLATE_ID: ""
  _EMAILJS_PUBLIC_KEY: ""

timeout: "1200s"

options:
  logging: CLOUD_LOGGING_ONLY
  substitution_option: ALLOW_LOOSE
